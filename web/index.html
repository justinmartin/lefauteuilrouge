<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#140608">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fauteuil Rouge">
  <title>Le Fauteuil Rouge</title>
  <meta name="description" content="Les sorties ciné de la semaine, le calendrier de l'année et le box-office.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Le Fauteuil Rouge, accueil">
      <img src="/logo.svg" alt="" width="34" height="34">
      <span class="wordmark"><i>le</i> Fauteuil <b>Rouge</b></span>
    </a>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="week" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2.5a2.5 2.5 0 0 0 0 5V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4.5a2.5 2.5 0 0 0 0-5z"/><path d="M14 5v2M14 11v2M14 17v2"/></svg>
      <span>Cette semaine</span>
    </button>
    <button class="tab" data-tab="calendar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span>Calendrier</span>
    </button>
    <button class="tab" data-tab="boxoffice" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l1.5 12h11L19 9"/><path d="M4 9h16M7 9l1-5M12 9V3M17 9l-1-5"/></svg>
      <span>Box-office</span>
    </button>
  </nav>

  <div class="sheet" id="film" role="dialog" aria-modal="true" aria-labelledby="film-title" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <button class="sheet-close" type="button" data-close aria-label="Fermer">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="film-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
