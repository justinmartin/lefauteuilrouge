<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fauteuil Rouge">
  <title>Le Fauteuil Rouge</title>
  <meta name="description" content="Les sorties ciné de la semaine, le calendrier de l'année, les séances du soir et le box-office.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Écran de bienvenue : une fois par jour, 2 s (ou un toucher), puis le logo grandit vers nous. Pas au premier lancement (la fiche
       « Bienvenue » du compte s'en charge) ni quand un lien ouvre directement un film. -->
  <div class="splash" id="splash" hidden>
    <div class="splash-logo"><img src="/logo.svg" alt="" width="128" height="128"><span class="pop" style="--x:-97px;--y:-147px;--r:-160deg;--d:0.1s"><svg viewBox="0 0 20 18" aria-hidden="true"><circle cx="6" cy="10" r="5" fill="#f6ead0"/><circle cx="13" cy="9" r="5.5" fill="#fbf3e2"/><circle cx="9.5" cy="5" r="4.5" fill="#fff8ec"/><circle cx="10" cy="12" r="3" fill="#e9cf8e"/></svg></span><span class="pop" style="--x:80px;--y:-176px;--r:140deg;--d:0.18s"><svg viewBox="0 0 20 18" aria-hidden="true"><circle cx="6" cy="10" r="5" fill="#f6ead0"/><circle cx="13" cy="9" r="5.5" fill="#fbf3e2"/><circle cx="9.5" cy="5" r="4.5" fill="#fff8ec"/><circle cx="10" cy="12" r="3" fill="#e9cf8e"/></svg></span><span class="pop" style="--x:-38px;--y:-218px;--r:-90deg;--d:0.27s"><svg viewBox="0 0 20 18" aria-hidden="true"><circle cx="6" cy="10" r="5" fill="#f6ead0"/><circle cx="13" cy="9" r="5.5" fill="#fbf3e2"/><circle cx="9.5" cy="5" r="4.5" fill="#fff8ec"/><circle cx="10" cy="12" r="3" fill="#e9cf8e"/></svg></span><span class="pop" style="--x:122px;--y:-109px;--r:200deg;--d:0.36s"><svg viewBox="0 0 20 18" aria-hidden="true"><circle cx="6" cy="10" r="5" fill="#f6ead0"/><circle cx="13" cy="9" r="5.5" fill="#fbf3e2"/><circle cx="9.5" cy="5" r="4.5" fill="#fff8ec"/><circle cx="10" cy="12" r="3" fill="#e9cf8e"/></svg></span><span class="pop" style="--x:-130px;--y:-84px;--r:-220deg;--d:0.45s"><svg viewBox="0 0 20 18" aria-hidden="true"><circle cx="6" cy="10" r="5" fill="#f6ead0"/><circle cx="13" cy="9" r="5.5" fill="#fbf3e2"/><circle cx="9.5" cy="5" r="4.5" fill="#fff8ec"/><circle cx="10" cy="12" r="3" fill="#e9cf8e"/></svg></span><span class="pop" style="--x:29px;--y:-193px;--r:120deg;--d:0.54s"><svg viewBox="0 0 20 18" aria-hidden="true"><circle cx="6" cy="10" r="5" fill="#f6ead0"/><circle cx="13" cy="9" r="5.5" fill="#fbf3e2"/><circle cx="9.5" cy="5" r="4.5" fill="#fff8ec"/><circle cx="10" cy="12" r="3" fill="#e9cf8e"/></svg></span><span class="pop" style="--x:-71px;--y:-126px;--r:-140deg;--d:0.62s"><svg viewBox="0 0 20 18" aria-hidden="true"><circle cx="6" cy="10" r="5" fill="#f6ead0"/><circle cx="13" cy="9" r="5.5" fill="#fbf3e2"/><circle cx="9.5" cy="5" r="4.5" fill="#fff8ec"/><circle cx="10" cy="12" r="3" fill="#e9cf8e"/></svg></span><span class="pop" style="--x:92px;--y:-210px;--r:170deg;--d:0.7s"><svg viewBox="0 0 20 18" aria-hidden="true"><circle cx="6" cy="10" r="5" fill="#f6ead0"/><circle cx="13" cy="9" r="5.5" fill="#fbf3e2"/><circle cx="9.5" cy="5" r="4.5" fill="#fff8ec"/><circle cx="10" cy="12" r="3" fill="#e9cf8e"/></svg></span></div>
    <p class="splash-title">Bienvenue<span id="splash-name"></span></p>
  </div>
  <script>
    (function () {
      var el = document.getElementById('splash');
      var get = function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
      var d = new Date(), day = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      var account = get('lfr_account');
      var deep = /[?&](film|une)=/.test(location.search);
      if (deep || get('lfr_splash') === day || !(account || get('lfr_onboarded'))) return;
      try { localStorage.setItem('lfr_splash', JSON.stringify(day)); } catch (e) {}
      if (account && account.pseudo) {
        var name = document.createElement('i');
        name.textContent = account.pseudo;
        document.getElementById('splash-name').append(', ', name);
      }
      el.hidden = false;
      document.documentElement.classList.add('splash-on');
      var fonts = document.fonts ? Promise.race([document.fonts.load('48px "Instrument Serif"'), new Promise(function (r) { setTimeout(r, 1200); })]) : Promise.resolve();
      fonts.then(function () { el.classList.add('in'); });
      var done = false, timer = setTimeout(close, 1500);
      function close() {
        if (done) return;
        done = true; clearTimeout(timer);
        el.classList.add('out');
        document.documentElement.classList.remove('splash-on');
        setTimeout(function () { el.remove(); }, 650);
      }
      el.addEventListener('click', close);
      document.addEventListener('keydown', close, { once: true });
    })();
  </script>
  <header class="top">
    <a class="brand" href="/" aria-label="Le Fauteuil Rouge, accueil">
      <img src="/logo.svg" alt="" width="30" height="30">
      <span class="wordmark">le fauteuil <i>rouge</i></span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="open-search" type="button" aria-label="Rechercher un film">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
      <button class="icon-btn" id="open-me" type="button" aria-label="Mon espace"></button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="affiche" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2.5a2.5 2.5 0 0 0 0 5V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4.5a2.5 2.5 0 0 0 0-5z"/><path d="M14 5v2M14 11v2M14 17v2"/></svg>
      <span>À l'affiche</span>
    </button>
    <button class="tab" data-tab="soir" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Ce soir</span>
    </button>
    <button class="tab" data-tab="une" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M7.5 9h6M7.5 12.5h6M7.5 16h4"/></svg>
      <span>À la une</span>
    </button>
    <button class="tab" data-tab="films" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>
      <span>Mes films</span>
    </button>
  </nav>

  <div class="sheet" id="film" role="dialog" aria-modal="true" aria-labelledby="film-title" hidden>
    <div class="sheet-body" id="film-body"></div>
  </div>

  <div class="sheet" id="search" role="dialog" aria-modal="true" aria-label="Rechercher" hidden>
    <div class="search-head">
      <label class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Un film, un réalisateur…" autocomplete="off" enterkeyhint="search" aria-label="Rechercher un film ou un réalisateur">
      </label>
      <button class="text-btn" type="button" data-close-search>Annuler</button>
    </div>
    <div class="sheet-body" id="search-body"></div>
  </div>

  <div class="sheet" id="account" role="dialog" aria-modal="true" aria-labelledby="account-title" hidden>
    <div class="sheet-head">
      <h2 id="account-title">Mon espace</h2>
      <button class="text-btn" type="button" data-close-account>Terminé</button>
    </div>
    <div class="sheet-body" id="account-body"></div>
  </div>

  <div class="sheet" id="pick" role="dialog" aria-modal="true" aria-labelledby="pick-title" hidden>
    <div class="sheet-head">
      <h2 id="pick-title">Mes cinémas</h2>
      <button class="text-btn" type="button" data-close-pick>Terminé</button>
    </div>
    <div class="sheet-body" id="pick-body"></div>
  </div>

  <div class="action-sheet" id="cal" hidden>
    <div class="as-backdrop" data-close></div>
    <div class="as-panel" role="dialog" aria-modal="true" aria-labelledby="cal-title">
      <h3 id="cal-title"></h3><p id="cal-sub"></p>
      <div class="as-options" id="cal-options"></div>
      <button class="as-cancel" type="button" data-close>Annuler</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
