<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fauteuil Rouge">
  <title>Le Fauteuil Rouge</title>
  <meta name="description" content="Les sorties ciné de la semaine, le calendrier de l'année et le box-office.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Le Fauteuil Rouge, accueil">
      <img src="/logo.svg" alt="" width="30" height="30">
      <span class="wordmark">le fauteuil <i>rouge</i></span>
    </a>
    <button class="icon-btn" id="open-list" type="button" aria-label="Ma liste">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>
      <span class="count" id="list-count" hidden></span>
    </button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="week" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2.5a2.5 2.5 0 0 0 0 5V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4.5a2.5 2.5 0 0 0 0-5z"/><path d="M14 5v2M14 11v2M14 17v2"/></svg>
      <span>Semaine</span>
    </button>
    <button class="tab" data-tab="calendar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span>Calendrier</span>
    </button>
    <button class="tab" data-tab="boxoffice" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Box-office</span>
    </button>
    <button class="tab" data-tab="cines" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>Mes cinés</span>
    </button>
  </nav>

  <div class="sheet" id="film" role="dialog" aria-modal="true" aria-labelledby="film-title" hidden>
    <div class="sheet-body" id="film-body"></div>
  </div>

  <div class="sheet" id="list" role="dialog" aria-modal="true" aria-labelledby="list-title" hidden>
    <div class="sheet-head">
      <h2 id="list-title">Ma liste</h2>
      <button class="text-btn" type="button" data-close-list>Terminé</button>
    </div>
    <div class="sheet-body" id="list-body"></div>
  </div>

  <div class="sheet" id="pick" role="dialog" aria-modal="true" aria-labelledby="pick-title" hidden>
    <div class="sheet-head">
      <h2 id="pick-title">Mes cinémas</h2>
      <button class="text-btn" type="button" data-close-pick>Terminé</button>
    </div>
    <div class="sheet-body" id="pick-body"></div>
  </div>

  <div class="action-sheet" id="cal" hidden>
    <div class="as-backdrop" data-close></div>
    <div class="as-panel" role="dialog" aria-modal="true" aria-labelledby="cal-title">
      <h3 id="cal-title"></h3><p id="cal-sub"></p>
      <div class="as-options" id="cal-options"></div>
      <button class="as-cancel" type="button" data-close>Annuler</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
