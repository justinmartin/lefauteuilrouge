name: Fiches complétées

# Chaque nuit : genre, durée, réalisation, casting, pays, titre original, synopsis et affiche des films que
# JP's Box-Office laisse vides, d'après Wikidata et Wikipédia (scripts/enrich.js → data/enrich.json).
on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: node scripts/enrich.js
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/enrich.json
          if git diff --cached --quiet; then echo "Rien de neuf"; exit 0; fi
          git commit -m "data: fiches complétées $(date -u +%Y-%m-%d)"
          git push
